name: Auto Translate Markdown

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'custom_firmware/README.md'
      - 'tracking/LIMITS.md'
      - 'myapps/tracking/README.md'
      - 'lock-pass.md'
      - 'ram.md'
      - 'td9_apps.md'
      - 'td9_aprs.md'
      - 'td9_kpi.md'
      - 'td9_logo.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Translator
        uses: dkxce/md-auto-translator@main
        with:
          translate_paths: |
            README.md
            custom_firmware/README.md
            tracking/LIMITS.md
            myapps/tracking/README.md
            lock-pass.md
            ram.md
            td9_apps.md
            td9_kpi.md
            td9_logo.md
          convert_skip: '**'